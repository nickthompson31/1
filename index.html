<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShineWater — Data Source Health</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #161b27;
      border-bottom: 1px solid #1e2535;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo h1 {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: -0.02em;
    }

    .logo p {
      font-size: 12px;
      color: #64748b;
      margin-top: 1px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .refresh-btn {
      background: #1e2535;
      border: 1px solid #2d3748;
      color: #94a3b8;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .refresh-btn:hover { background: #263045; color: #e2e8f0; }
    .refresh-btn.spinning svg { animation: spin 1s linear infinite; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .last-checked {
      font-size: 12px;
      color: #475569;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 24px 48px;
    }

    /* Summary bar */
    .summary {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .summary-card {
      flex: 1;
      min-width: 140px;
      background: #161b27;
      border: 1px solid #1e2535;
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .summary-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .summary-card .count {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .summary-card .label {
      font-size: 12px;
      color: #64748b;
      margin-top: 3px;
    }

    .dot-fresh { background: #10b981; box-shadow: 0 0 6px #10b98166; }
    .dot-warning { background: #f59e0b; box-shadow: 0 0 6px #f59e0b66; }
    .dot-stale { background: #ef4444; box-shadow: 0 0 6px #ef444466; }
    .dot-unknown { background: #6b7280; }

    .count-fresh { color: #10b981; }
    .count-warning { color: #f59e0b; }
    .count-stale { color: #ef4444; }
    .count-unknown { color: #6b7280; }

    /* Groups */
    .groups {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 16px;
    }

    .group-card {
      background: #161b27;
      border: 1px solid #1e2535;
      border-radius: 12px;
      overflow: hidden;
    }

    .group-card.border-fresh { border-color: #10b98133; }
    .group-card.border-warning { border-color: #f59e0b33; }
    .group-card.border-stale { border-color: #ef444433; }

    .group-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e2535;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .group-icon {
      font-size: 16px;
      width: 28px;
      text-align: center;
    }

    .group-name {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .group-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.03em;
    }

    .badge-fresh { background: #10b98120; color: #34d399; }
    .badge-warning { background: #f59e0b20; color: #fbbf24; }
    .badge-stale { background: #ef444420; color: #f87171; }
    .badge-unknown { background: #6b728020; color: #9ca3af; }

    /* Table rows */
    .source-row {
      display: flex;
      align-items: center;
      padding: 10px 18px;
      border-bottom: 1px solid #1a2030;
      gap: 10px;
    }

    .source-row:last-child { border-bottom: none; }
    .source-row:hover { background: #1a2030; }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.fresh { background: #10b981; }
    .status-dot.warning { background: #f59e0b; }
    .status-dot.stale { background: #ef4444; }
    .status-dot.unknown { background: #6b7280; }

    .source-name {
      flex: 1;
      font-size: 13px;
      color: #cbd5e1;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
    }

    .source-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .source-age {
      font-size: 12px;
      color: #64748b;
      text-align: right;
      min-width: 90px;
    }

    .source-age.fresh { color: #34d399; }
    .source-age.warning { color: #fbbf24; }
    .source-age.stale { color: #f87171; }
    .source-age.unknown { color: #6b7280; }

    .source-rows {
      font-size: 11px;
      color: #475569;
      min-width: 60px;
      text-align: right;
    }

    .cadence-pill {
      font-size: 10px;
      color: #475569;
      background: #1e2535;
      padding: 2px 6px;
      border-radius: 4px;
      min-width: 44px;
      text-align: center;
    }

    /* Loading / error states */
    .loading-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px;
      color: #475569;
      font-size: 14px;
      gap: 10px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #2d3748;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .error-box {
      background: #ef444410;
      border: 1px solid #ef444433;
      color: #f87171;
      padding: 16px 20px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .countdown {
      font-size: 11px;
      color: #334155;
    }

    @media (max-width: 600px) {
      .groups { grid-template-columns: 1fr; }
      header { padding: 16px; }
      main { padding: 16px; }
      .source-rows, .cadence-pill { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">💧</div>
    <div>
      <h1>ShineWater — Data Health</h1>
      <p>Automated source monitoring</p>
    </div>
  </div>
  <div class="header-right">
    <span class="last-checked" id="lastChecked">Checking…</span>
    <span class="countdown" id="countdown"></span>
    <button class="refresh-btn" id="refreshBtn" onclick="refresh()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Refresh
    </button>
  </div>
</header>

<main>
  <div id="errorBox" class="error-box" style="display:none"></div>
  <div id="summaryBar" class="summary" style="display:none">
    <div class="summary-card">
      <div class="summary-dot dot-fresh"></div>
      <div>
        <div class="count count-fresh" id="countFresh">—</div>
        <div class="label">Fresh</div>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-dot dot-warning"></div>
      <div>
        <div class="count count-warning" id="countWarning">—</div>
        <div class="label">Warning</div>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-dot dot-stale"></div>
      <div>
        <div class="count count-stale" id="countStale">—</div>
        <div class="label">Stale / Missing</div>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-dot dot-unknown" style="background:#3b82f6"></div>
      <div>
        <div class="count" style="color:#3b82f6" id="countTotal">—</div>
        <div class="label">Total Sources</div>
      </div>
    </div>
  </div>
  <div id="content">
    <div class="loading-overlay"><div class="spinner"></div> Loading data sources…</div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://qgkhipkujgfhkngimdxh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFna2hpcGt1amdmaGtuZ2ltZHhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4NjQyNzMsImV4cCI6MjA4NzQ0MDI3M30.iC6IcXQ0jInIwsZrCePUJHTc-xnbLJPBgOYJ_7SNKRk';

const GROUP_META = {
  'Shopify':    { icon: '🛒', order: 1 },
  'Meta Ads':   { icon: '📘', order: 2 },
  'Instagram':  { icon: '📸', order: 3 },
  'Google Ads': { icon: '🔍', order: 4 },
  'Amazon Ads': { icon: '📦', order: 5 },
  'UNFI':       { icon: '🚚', order: 6 },
  'Zigpoll':    { icon: '📊', order: 7 },
};

const SOURCE_LABELS = {
  shopify_orders: 'Orders',
  shopify_customers: 'Customers',
  shopify_products: 'Products',
  shopify_variants: 'Variants',
  shopify_order_line_items: 'Order Line Items',
  meta_campaigns: 'Campaigns',
  meta_adsets: 'Ad Sets',
  meta_ads: 'Ads',
  meta_ad_insights: 'Ad Insights',
  instagram_account_daily: 'Account Daily',
  instagram_insights: 'Insights',
  instagram_posts: 'Posts',
  google_ads_campaigns: 'Campaigns',
  google_ads_insights: 'Insights',
  google_ads_assets: 'Assets',
  google_ads_asset_group_perf: 'Asset Group Perf',
  amazon_ads_daily: 'Ads Daily',
  amazon_campaigns: 'Campaigns',
  amazon_keywords_daily: 'Keywords Daily',
  amazon_search_terms: 'Search Terms',
  amazon_product_ads_daily: 'Product Ads Daily',
  unfi_delivery_service_level: 'Delivery Service Level',
  zigpoll_responses: 'Survey Responses',
};

function getStatus(lastSynced, cadenceHours) {
  if (!lastSynced) return 'stale';
  const ageHours = (Date.now() - new Date(lastSynced).getTime()) / 3600000;
  if (ageHours <= cadenceHours * 1.5) return 'fresh';
  if (ageHours <= cadenceHours * 3) return 'warning';
  return 'stale';
}

function formatAge(lastSynced) {
  if (!lastSynced) return 'Never';
  const ms = Date.now() - new Date(lastSynced).getTime();
  const mins = Math.floor(ms / 60000);
  const hrs  = Math.floor(ms / 3600000);
  const days = Math.floor(ms / 86400000);
  const wks  = Math.floor(days / 7);
  if (mins < 2)   return 'Just now';
  if (mins < 60)  return `${mins}m ago`;
  if (hrs < 24)   return `${hrs}h ago`;
  if (days < 14)  return `${days}d ago`;
  return `${wks}w ago`;
}

function formatCadence(h) {
  if (h < 24) return `${h}h`;
  if (h < 168) return `${h/24}d`;
  return `${h/168}w`;
}

function groupWorstStatus(rows) {
  const priority = { stale: 3, warning: 2, fresh: 1 };
  return rows.reduce((worst, r) => {
    const s = getStatus(r.last_synced, r.cadence_hours);
    return (priority[s] || 0) > (priority[worst] || 0) ? s : worst;
  }, 'fresh');
}

function renderDashboard(data) {
  // Group rows
  const groups = {};
  for (const row of data) {
    if (!groups[row.group_name]) groups[row.group_name] = [];
    groups[row.group_name].push(row);
  }

  // Summary counts
  let fresh = 0, warning = 0, stale = 0;
  for (const row of data) {
    const s = getStatus(row.last_synced, row.cadence_hours);
    if (s === 'fresh') fresh++;
    else if (s === 'warning') warning++;
    else stale++;
  }

  document.getElementById('countFresh').textContent = fresh;
  document.getElementById('countWarning').textContent = warning;
  document.getElementById('countStale').textContent = stale;
  document.getElementById('countTotal').textContent = data.length;
  document.getElementById('summaryBar').style.display = 'flex';

  // Sort groups by order
  const sortedGroups = Object.entries(groups).sort(([a], [b]) => {
    return (GROUP_META[a]?.order || 99) - (GROUP_META[b]?.order || 99);
  });

  let html = '<div class="groups">';
  for (const [groupName, rows] of sortedGroups) {
    const worstStatus = groupWorstStatus(rows);
    const meta = GROUP_META[groupName] || { icon: '📁' };

    html += `<div class="group-card border-${worstStatus}">`;
    html += `<div class="group-header">
      <div class="group-title">
        <span class="group-icon">${meta.icon}</span>
        <span class="group-name">${groupName}</span>
      </div>
      <span class="group-badge badge-${worstStatus}">${worstStatus.toUpperCase()}</span>
    </div>`;

    for (const row of rows) {
      const status = getStatus(row.last_synced, row.cadence_hours);
      const age = formatAge(row.last_synced);
      const label = SOURCE_LABELS[row.source_name] || row.source_name;
      const rowCount = row.row_count != null ? Number(row.row_count).toLocaleString() : '—';
      const cadence = formatCadence(row.cadence_hours);

      html += `<div class="source-row">
        <div class="status-dot ${status}"></div>
        <div class="source-name">${label}</div>
        <div class="source-meta">
          <span class="source-rows">${rowCount} rows</span>
          <span class="cadence-pill">/${cadence}</span>
          <span class="source-age ${status}">${age}</span>
        </div>
      </div>`;
    }

    html += '</div>';
  }
  html += '</div>';

  document.getElementById('content').innerHTML = html;
}

let countdownInterval = null;
let nextRefreshAt = null;

function startCountdown(seconds) {
  clearInterval(countdownInterval);
  nextRefreshAt = Date.now() + seconds * 1000;
  countdownInterval = setInterval(() => {
    const remaining = Math.max(0, Math.round((nextRefreshAt - Date.now()) / 1000));
    document.getElementById('countdown').textContent = remaining > 0 ? `next in ${remaining}s` : '';
    if (remaining === 0) clearInterval(countdownInterval);
  }, 1000);
}

async function fetchData() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_data_source_status`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
    },
    body: '{}',
  });

  if (!res.ok) {
    const text = await res.text();
    throw new Error(`Supabase error ${res.status}: ${text}`);
  }

  return res.json();
}

async function refresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  document.getElementById('errorBox').style.display = 'none';

  try {
    const data = await fetchData();
    renderDashboard(data);
    const now = new Date();
    document.getElementById('lastChecked').textContent =
      `Last checked ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    startCountdown(300);
  } catch (err) {
    document.getElementById('errorBox').textContent = `Failed to load: ${err.message}`;
    document.getElementById('errorBox').style.display = 'block';
  } finally {
    btn.classList.remove('spinning');
  }
}

// Auto-refresh every 5 minutes
refresh();
setInterval(refresh, 300000);
</script>
</body>
</html>
